<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Vistoria Cautelar Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;color:#111;min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.active{display:flex}
.topbar{background:#fff;border-bottom:1px solid #e5e5e5;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:17px;font-weight:600;flex:1}
.back{background:none;border:none;cursor:pointer;color:#007aff;font-size:15px;padding:4px 8px;white-space:nowrap}
.content{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:600px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:12px;border:1px solid #e5e5e5;padding:16px}
.card h2{font-size:11px;font-weight:600;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.field{margin-bottom:12px}
.field label{font-size:13px;color:#555;display:block;margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#fff;color:#111;appearance:none}
.btn{padding:13px 20px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid #ddd;background:#fff;color:#111;width:100%;text-align:center}
.btn.primary{background:#1c1c1e;color:#fff;border-color:#1c1c1e}
.btn.success{background:#10b981;color:#fff;border-color:#10b981}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.photo-card{border-radius:10px;overflow:hidden;border:1px solid #e5e5e5;position:relative;background:#000}
.photo-card img{width:100%;height:130px;display:block;object-fit:cover}
.photo-label{background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:4px 8px;position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between}
.camera-overlay{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column}
.cam-video-wrap{flex:1;position:relative;overflow:hidden}
.cam-video-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);margin:20px auto}
.sig-pad{border:1px solid #ddd;border-radius:10px;background:#fff;width:100%;height:160px;touch-action:none}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:12px 24px;border-radius:24px;display:none;z-index:9999}
</style>
</head>
<body>

<div id="s-login" class="screen active">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
    <h1 style="margin-bottom:30px">Vistoria Cautelar</h1>
    <div class="field" style="width:100%"><label>E-mail</label><input type="email" id="login-email"></div>
    <div class="field" style="width:100%"><label>Senha</label><input type="password" id="login-pass"></div>
    <button class="btn primary" onclick="doLogin()">Entrar</button>
  </div>
</div>

<div id="s-dash" class="screen">
  <div class="topbar"><h1>Início</h1><button class="back" onclick="doLogout()">Sair</button></div>
  <div class="content">
    <button class="btn primary" onclick="goTo('s-nova-vistoria')">+ Nova Vistoria</button>
    <button class="btn" onclick="goTo('s-historico')">Ver Histórico</button>
  </div>
</div>

<div id="s-nova-vistoria" class="screen">
  <div class="topbar"><button class="back" onclick="goTo('s-dash')">Voltar</button><h1>Dados Iniciais</h1></div>
  <div class="content">
    <div class="card">
        <div class="field"><label>Cliente</label><select id="nv-cliente" onchange="loadColetoresByCliente()"><option value="">Carregando...</option></select></div>
        <div class="field"><label>Coletor</label><select id="nv-coletor"></select></div>
        <div class="field"><label>Morador</label><input type="text" id="nv-nome"></div>
        <div class="field"><label>CPF/RG</label><input type="text" id="nv-doc"></div>
        <div class="field"><label>Rua</label><input type="text" id="nv-rua"></div>
        <div class="field"><label>Número</label><input type="text" id="nv-num"></div>
    </div>
    <button class="btn primary" onclick="criarVistoria()">Próximo</button>
  </div>
</div>

<div id="s-vistoria" class="screen">
  <div class="topbar"><button class="back" onclick="goTo('s-dash')">Sair</button><h1>Fotos</h1></div>
  <div class="content">
    <div class="field"><label>Ambiente</label><select id="v-ambiente"><option value="Fachada">Fachada</option><option value="Calçada">Calçada</option><option value="Garagem">Garagem</option><option value="Sala">Sala</option><option value="Cozinha">Cozinha</option><option value="Banheiro">Banheiro</option></select></div>
    <div class="field"><label>Patologia</label><select id="v-patologia"><option value="Vista">Vista (Sem patologia)</option><option value="Fissura">Fissura</option><option value="Trinca">Trinca</option><option value="Rachadura">Rachadura</option><option value="Umidade">Umidade</option><option value="Danificado">Danificado</option></select></div>
    <button class="btn primary" onclick="abrirCamera()">Tirar Foto</button>
    <div id="fotos-list" class="photo-grid" style="margin-top:20px"></div>
    <button class="btn success" onclick="goTo('s-finalizacao')">Próximo</button>
  </div>
</div>

<div id="s-finalizacao" class="screen">
    <div class="topbar"><h1>Conclusão</h1></div>
    <div class="content">
        <div class="field"><label>Estado de Conservação</label><select id="fin-estado"><option>Bom</option><option selected>Regular</option><option>Ruim</option><option>Péssimo</option></select></div>
        <div class="field"><label>Idade Aparente (Anos)</label><input type="number" id="fin-idade"></div>
        <label>Assinatura Responsável</label>
        <canvas id="sig-canvas" class="sig-pad"></canvas>
        <button class="btn success" onclick="finalizarVistoria()">Gerar Relatório</button>
    </div>
</div>

<div id="camera-overlay" class="camera-overlay" style="display:none">
    <div class="cam-video-wrap"><video id="cam-video" autoplay playsinline muted></video></div>
    <button class="shutter" onclick="tirarFoto()"></button>
    <button class="btn" style="width:100px; margin: 0 auto 20px; background: #333; color: white" onclick="fecharCamera()">Cancelar</button>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Credenciais extraídas do seu arquivo original
const firebaseConfig = {
    apiKey: "AIzaSyAwwO2yLyNVnKMLFfmKKCx64zeh7Tbgrvc",
    authDomain: "vistoria-cautelar-71f6d.firebaseapp.com",
    projectId: "vistoria-cautelar-71f6d",
    storageBucket: "vistoria-cautelar-71f6d.firebasestorage.app",
    messagingSenderId: "157244396794",
    appId: "1:157244396794:web:c0b983583939e13e91a543"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentVistoria = null;
let fotosPendentes = [];
let cameraStream = null;

window.goTo = (id) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 's-nova-vistoria') loadClientes();
    if(id === 's-finalizacao') initSig();
};

window.doLogin = async () => {
    const e = document.getElementById('login-email').value;
    const p = document.getElementById('login-pass').value;
    try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert('Erro no login'); }
};
window.doLogout = () => signOut(auth);
onAuthStateChanged(auth, u => { if(u) goTo('s-dash'); else goTo('s-login'); });

async function loadClientes() {
    const sel = document.getElementById('nv-cliente');
    const snap = await getDocs(collection(db, "clientes"));
    sel.innerHTML = '<option value="">Selecione...</option>';
    snap.forEach(d => sel.innerHTML += `<option value="${d.id}">${d.data().nome}</option>`);
}

window.loadColetoresByCliente = async () => {
    const cId = document.getElementById('nv-cliente').value;
    const sel = document.getElementById('nv-coletor');
    sel.innerHTML = '<option>Carregando...</option>';
    const q = query(collection(db, "coletores"), where("clienteId", "==", cId));
    const snap = await getDocs(q);
    sel.innerHTML = '';
    snap.forEach(d => sel.innerHTML += `<option value="${d.id}">${d.data().nome}</option>`);
};

window.criarVistoria = () => {
    currentVistoria = {
        nome: document.getElementById('nv-nome').value,
        doc: document.getElementById('nv-doc').value,
        rua: document.getElementById('nv-rua').value,
        num: document.getElementById('nv-num').value,
        clienteNome: document.getElementById('nv-cliente').selectedOptions[0].text,
        coletorNome: document.getElementById('nv-coletor').selectedOptions[0].text,
        data: new Date().toLocaleDateString('pt-BR')
    };
    goTo('s-vistoria');
};

window.abrirCamera = async () => {
    document.getElementById('camera-overlay').style.display = 'flex';
    cameraStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
    });
    document.getElementById('cam-video').srcObject = cameraStream;
};

window.fecharCamera = () => {
    if(cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    document.getElementById('camera-overlay').style.display = 'none';
};

window.tirarFoto = () => {
    const video = document.getElementById('cam-video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const data = canvas.toDataURL('image/jpeg', 0.8);
    
    const amb = document.getElementById('v-ambiente').value;
    const pat = document.getElementById('v-patologia').value;
    
    fotosPendentes.push({
        data, 
        ambiente: amb,
        patologia: pat,
        legenda: pat === "Vista" ? "Vista" : `${amb} ${pat}`,
        num: fotosPendentes.length + 1
    });
    renderFotos();
    fecharCamera();
};

function renderFotos() {
    const list = document.getElementById('fotos-list');
    list.innerHTML = '';
    fotosPendentes.forEach(f => {
        list.innerHTML += `<div class="photo-card"><img src="${f.data}"><div class="photo-label"><span>Foto ${f.num}</span><span>${f.legenda}</span></div></div>`;
    });
}

function initSig() {
    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
    let drawing = false;
    canvas.addEventListener('touchstart', e => { drawing = true; ctx.beginPath(); });
    canvas.addEventListener('touchend', () => drawing = false);
    canvas.addEventListener('touchmove', e => {
        if(!drawing) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
        ctx.stroke();
    });
}

window.finalizarVistoria = async () => {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const ML = 12.7, MT = 12.7, CW = 184.6;

    const drawHeader = (local) => {
        pdf.setDrawColor(0); pdf.setLineWidth(0.3);
        pdf.rect(ML, MT, CW, 45); 
        
        pdf.setFont("helvetica", "bold"); pdf.setFontSize(10);
        pdf.text("RELATÓRIO DE VISTORIA CAUTELAR", ML + CW/2, MT + 6, {align: 'center'});
        pdf.text("RRT: 15596155", ML + CW - 2, MT + 6, {align: 'right'});
        pdf.line(ML, MT+9, ML+CW, MT+9);
        
        pdf.setFontSize(8);
        pdf.text("INFORMAÇÕES DO RESPONSÁVEL", ML + CW/2, MT + 13, {align: 'center'});
        pdf.line(ML, MT+16, ML+CW, MT+16);
        
        pdf.text(`Nome: ${currentVistoria.nome}`, ML + 2, MT + 20);
        pdf.line(ML, MT+23, ML+CW, MT+23);
        
        pdf.text(`CPF/RG: ${currentVistoria.doc}`, ML + 2, MT + 27);
        pdf.line(ML + 90, MT+23, ML+90, MT+30);
        pdf.text(`Contato: (11) 9999-9999`, ML + 92, MT + 27);
        pdf.line(ML, MT+30, ML+CW, MT+30);
        
        pdf.text(`Endereço: ${currentVistoria.rua}, ${currentVistoria.num}`, ML + 2, MT + 34);
        pdf.line(ML, MT+37, ML+CW, MT+37);

        const est = document.getElementById('fin-estado').value;
        const idad = document.getElementById('fin-idade').value;
        pdf.text(`Estado de Conservação: ${est}`, ML + 2, MT + 41);
        pdf.text(`Idade Aparente: ${idad} anos`, ML + CW - 2, MT + 41, {align: 'right'});
        pdf.line(ML, MT+45, ML+CW, MT+45);
        
        pdf.text(`Local: ${local}`, ML + 2, MT + 44);
        pdf.text(`Data Vistoria: ${currentVistoria.data}`, ML + CW - 2, MT + 44, {align: 'right'});
    };

    let y = MT + 50;
    let localPagina = fotosPendentes.length > 0 ? fotosPendentes[0].ambiente : "Fachada";
    drawHeader(localPagina);

    for(let i=0; i < fotosPendentes.length; i++) {
        const f = fotosPendentes[i];
        if (i > 0 && i % 4 === 0) { pdf.addPage(); y = MT + 50; drawHeader(f.ambiente); }

        const isRight = i % 2 !== 0;
        const x = isRight ? ML + (CW/2) : ML;
        const boxW = CW/2; const boxH = 55;

        // Moldura única centralizada
        pdf.setDrawColor(0); pdf.rect(x, y, boxW, boxH);
        
        // Foto com margem interna
        const img = new Image(); img.src = f.data;
        const imgPadding = 3;
        const availW = boxW - (imgPadding * 2);
        const availH = boxH - 12; 
        
        const ratio = img.width / img.height;
        let finalW, finalH;
        if(ratio > 1) { finalW = availW; finalH = availW / ratio; }
        else { finalH = availH; finalW = availH * ratio; }

        pdf.addImage(f.data, 'JPEG', x + (boxW-finalW)/2, y + 2, finalW, finalH);

        // Linha de legenda
        pdf.line(x, y + boxH - 8, x + boxW, y + boxH - 8);
        pdf.setFontSize(8); pdf.setFont(undefined, 'bold');
        pdf.text(`Foto ${String(f.num).padStart(2,'0')}`, x + 2, y + boxH - 5);
        pdf.setFont(undefined, 'normal'); pdf.setFontSize(7);
        pdf.text(f.legenda, x + 2, y + boxH - 1);

        if(isRight) y += boxH + 5;
    }

    // Página Final com Assinatura
    pdf.addPage();
    pdf.setFontSize(12); pdf.text("DADOS DE CONCLUSÃO", ML, 30);
    const sigData = document.getElementById('sig-canvas').toDataURL();
    pdf.rect(ML, 40, 80, 30); // Box assinatura
    pdf.addImage(sigData, 'PNG', ML + 5, 42, 70, 25);
    pdf.setFontSize(8); pdf.text("Assinatura do Responsável", ML + 5, 75);

    pdf.save(`${currentVistoria.coletorNome}_Cautelar.pdf`);
};
</script>
</body>
</html>
